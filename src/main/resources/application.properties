spring.application.name=Planificador-Tareas-Backend

# ==========================================================
# Base de datos PostgreSQL
# ==========================================================
# Valores por defecto para desarrollo LOCAL (fuera de Docker).
# Crea antes la base de datos: CREATE DATABASE tasks_db;
#
# Para Docker Compose, Supabase o para desplegar en Render, NO edites estas
# lineas: sobreescribe los valores mediante variables de entorno (Spring las
# detecta automaticamente): SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD (ver README.md, seccion "Usar Supabase").
#
# NOTA: tu instalacion local de PostgreSQL 17 quedo escuchando en el puerto
# 5433 (no el 5432 estandar) porque tambien tienes la version 16 instalada.
# Verifica tu propio puerto y clave con: Get-Service *postgres*  y
# revisando pgAdmin > clic derecho al servidor > Properties > Connection.
spring.datasource.url=jdbc:postgresql://localhost:5433/tasks_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# NOTA: no se configura spring.jackson.serialization.write-dates-as-timestamps
# porque este proyecto usa Jackson 3 (via Spring Boot 4.1.1), donde ese flag
# ya no existe: las fechas java.time se serializan como texto ISO-8601 por
# defecto, sin necesidad de configuracion adicional.

# ==========================================================
# Servidor
# ==========================================================
# Render inyecta la variable PORT en tiempo de ejecucion.
server.port=${PORT:8080}
