spring.application.name=Planificador-Tareas-Backend

# ==========================================================
# Base de datos PostgreSQL
# ==========================================================
# Valores por defecto para desarrollo LOCAL (fuera de Docker).
# Crea antes la base de datos: CREATE DATABASE tasks_db;
#
# Para Docker Compose, Supabase o para desplegar en Render, NO edites estas
# lineas: sobreescribe los valores mediante variables de entorno (Spring las
# detecta automaticamente): SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD (ver README.md, seccion "Usar Supabase").
#
# Si tu PostgreSQL local usa un puerto distinto al estandar 5432 (por ejemplo,
# 5433 cuando hay varias versiones instaladas), cambia el puerto aqui abajo.
spring.datasource.url=jdbc:postgresql://localhost:5432/tasks_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Serializar fechas como texto ISO-8601 (no como arreglos de numeros)
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================================
# Servidor
# ==========================================================
# Render inyecta la variable PORT en tiempo de ejecucion.
server.port=${PORT:8080}
